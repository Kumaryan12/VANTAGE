[project]
name = "vantage-backend"
version = "0.2.0"
description = "Read-only portfolio risk analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "numpy>=2.2,<3", "pandas>=2.2,<4", "pyarrow>=19,<24", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "kiteconnect>=5,<6",
  "scipy>=1.14,<2", "arch>=7.2,<9", "lightgbm>=4.6,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
