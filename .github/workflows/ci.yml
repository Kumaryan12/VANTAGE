name: Verify VANTAGE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vantage_test
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: ci_test_only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vantage -d vantage_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://vantage:ci_test_only@localhost:5432/vantage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: ruff check backend data/sample/generate.py
      - run: ruff format --check backend data/sample/generate.py
      - run: pytest -c backend/pyproject.toml backend/tests -q
      - name: Non-root Linux PDF confinement probe
        run: |
          mkdir -p artifacts/phase6/parser-probe
          PYTHONPATH=backend/tests python -c 'from document_fixtures import pdf_bytes, LIQUIDITY; from pathlib import Path; p=Path("artifacts/phase6/parser-probe"); (p/"input.pdf").write_bytes(pdf_bytes([LIQUIDITY])); (p/"other.pdf").write_bytes(b"SYNTHETIC foreign source"); (p/"credential-canary").write_text("SYNTHETIC canary")'
          docker build -f infra/Dockerfile.parser-test -t vantage-parser-test:ci .
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges=true --tmpfs /tmp:rw,noexec,nosuid,size=16m -v "$PWD/artifacts/phase6/parser-probe:/probe:ro" vantage-parser-test:ci
      - run: alembic -c backend/alembic.ini upgrade head
      - name: Actual distributed job crash, cancellation, quotas and all task adapters
        run: python backend/scripts/worker_smoke.py
        env:
          JOB_BACKEND: celery
          REDIS_URL: redis://127.0.0.1:56379/0
      - name: Durable identity restart and cross-user recovery slice
        run: python backend/scripts/identity_smoke.py
      - name: PostgreSQL-backed Phase 1 and Phase 2 vertical slice
        run: python backend/scripts/smoke_phase2.py
      - name: PostgreSQL-backed Phase 3 models and reproduction
        run: python backend/scripts/research_report.py --smoke
      - name: PostgreSQL-backed agent golden workflows and security probes
        run: python backend/scripts/agent_evaluate.py --no-report
      - name: PostgreSQL-backed optimization, studies, scenario replay and fixed agent cases
        run: python backend/scripts/optimization_validate.py --smoke

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Prepare backend for browser tests
        run: |
          python -m pip install -r ../backend/requirements.lock
          python -m pip install --no-deps -e ../backend
          alembic -c ../backend/alembic.ini upgrade head
      - name: Verify runner Chrome
        run: google-chrome --version
      - run: npm run test:e2e
        env:
          VANTAGE_PYTHON: python
          PLAYWRIGHT_CHANNEL: chrome
