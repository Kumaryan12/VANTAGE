name: Verify VANTAGE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vantage_test
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: ci_test_only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vantage -d vantage_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://vantage:ci_test_only@localhost:5432/vantage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: ruff check backend data/sample/generate.py
      - run: ruff format --check backend data/sample/generate.py
      - run: pytest -c backend/pyproject.toml backend/tests -q
      - run: alembic -c backend/alembic.ini upgrade head
      - name: PostgreSQL-backed vertical slice
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database.session import engine
          from sqlalchemy import text
          with TestClient(app) as client:
              assert client.get('/api/health').status_code == 200
              assert client.get('/api/portfolio').json()['synthetic'] is True
              result = client.get('/api/risk')
              assert result.status_code == 200, result.text
              assert result.json()['sample_size'] == 252
          with engine.connect() as connection:
              assert connection.execute(text('SELECT count(*) FROM risk_runs')).scalar_one() >= 1
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Prepare backend for browser tests
        run: |
          python -m pip install -r ../backend/requirements.lock
          python -m pip install --no-deps -e ../backend
          alembic -c ../backend/alembic.ini upgrade head
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VANTAGE_PYTHON: python
